name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: '1'
      MONGODB_URI: 'mongodb://localhost:27017/ci-placeholder'
      AUTH_SECRET: 'ci-placeholder-secret-not-used-at-runtime'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npx prettier --check . || echo "::warning::Formatting drift detected — run 'npm run format'"

      - name: Build
        run: npm run build
