version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # next-auth v5 is in beta; major-range jumps need manual testing.
      - dependency-name: next-auth
        versions: ['>=6']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
